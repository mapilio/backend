name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP style, analysis, audit, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js for contributor environment verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'

      - name: Verify contributor environment rules and CI platform
        run: |
          scripts/development/doctor.test.sh
          before=$(git status --porcelain=v1)
          scripts/development/doctor.sh
          after=$(git status --porcelain=v1)
          test "${before}" = "${after}"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: composer format:test

      - name: Run baseline-free static analysis
        run: composer analyse

      - name: Run level 6 static analysis for queue jobs
        run: composer analyse:jobs

      - name: Run level 6 static analysis for AI job predictions
        run: composer analyse:ai-predictions

      - name: Run level 6 static analysis for GeoPublishing
        run: composer analyse:geo-publishing

      - name: Run level 6 static analysis for IdentityAccess
        run: composer analyse:identity-access

      - name: Run level 6 static analysis for ImageryReports
        run: composer analyse:imagery-reports

      - name: Run level 6 static analysis for Organizations
        run: composer analyse:organizations

      - name: Run level 6 static analysis for Projects
        run: composer analyse:projects

      - name: Run level 6 static analysis for BillingCatalog
        run: composer analyse:billing-catalog

      - name: Run level 6 static analysis for PublicContent
        run: composer analyse:public-content

      - name: Run level 6 static analysis for Gamification
        run: composer analyse:gamification

      - name: Run level 6 static analysis for ImageryUploads
        run: composer analyse:imagery-uploads

      - name: Run level 6 static analysis for OperationsDashboard
        run: composer analyse:operations-dashboard

      - name: Run level 6 static analysis for DataMigration
        run: composer analyse:data-migration

      - name: Verify Laravel configuration caching
        run: |
          php artisan config:cache
          php artisan config:clear

      - name: Run backend tests
        run: php artisan test

  api-contract:
    name: OpenAPI contract, npm audit, and asset build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install locked contract tooling
        run: npm ci --ignore-scripts

      - name: Test the local GeoJSON validator
        run: npm run test:geojson-validator

      - name: Test GitHub administrator/signing live-state verifier
        run: npm run test:github-administrator-signing-readiness

      - name: Audit locked npm dependencies
        run: npm audit --audit-level=high

      - name: Verify pending project-license state
        run: npm run check:license-state

      - name: Check tracked Markdown links
        run: npm run check:markdown-links

      - name: Audit public repository content and history
        run: npm run audit:public-content

      - name: Lint OpenAPI contract
        run: npm run lint:openapi

      - name: Validate OpenAPI examples
        run: npm run validate:api-examples

      - name: Verify generated API documentation
        run: npm run check:api-docs

      - name: Build backend web assets
        run: npm run build

  postgis-migrations:
    name: PostgreSQL 14 and PostGIS migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgis:
        image: postgis/postgis:14-3.5@sha256:46b46bcd0ed1a60adceacbcb5116f3370f44608d50b5cc5935849872b762c0ab
        env:
          POSTGRES_DB: mapilio_ci
          POSTGRES_USER: mapilio_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapilio_ci -d mapilio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pdo_pgsql, pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Verify disposable PostGIS migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: mapilio_ci
          DB_USERNAME: mapilio_ci
          DB_SSLMODE: disable
          DB_URL: ''
          MAPILIO_DISPOSABLE_DB_CONFIRMED: 'true'
          MAPILIO_LEGACY_DB_CONNECTION: sqlite
          MAPILIO_DEMO_SEEDING_ENABLED: 'false'
        run: scripts/database/verify-postgis-migrations.sh
